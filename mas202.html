<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập các môn MAS202 (Giao diện ảnh to)</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f2f5;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 95%;
        max-width: 1200px;
        margin: 20px auto;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
        color: #333;
        margin-bottom: 20px;
    }

    #homeView {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
    }

    .exam-btn {
        width: 80%;
        max-width: 500px;
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: #007bff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        margin: 5px;
    }

    .exam-btn:hover { background-color: #0056b3; }

    .header {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
        color: #d9534f;
    }

    .nav-top { margin-bottom: 20px; }

    .nav-top button, .mode button {
        padding: 12px 20px;
        margin: 5px;
        font-size: 16px;
        border: 1px solid #ccc;
        background: #f8f9fa;
        cursor: pointer;
        border-radius: 5px;
        transition: 0.2s;
    }

    .nav-top button:hover, .mode button:hover { background: #e2e6ea; }

    .btn-home {
        background-color: #6c757d !important;
        color: white;
        border: none !important;
    }

    .btn-answer {
        background-color: #28a745 !important;
        color: white;
        font-weight: bold;
        border: none !important;
        padding: 15px 30px !important;
        font-size: 18px !important;
        margin-top: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-answer:hover { background-color: #218838 !important; }

    .img-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        overflow: hidden;
        padding: 10px;
    }

    #questionImg {
        width: 100%;
        max-width: 1000px; /* Ảnh đề to rõ */
        border: 2px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        image-rendering: high-quality;
        image-rendering: -webkit-optimize-contrast; 
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: zoom-in;
        transform-origin: center top;
    }
    
    #questionImg:hover {
        box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    }

    #answerImg {
        max-width: 100%;
        max-height: 70vh; /* Ảnh đáp án nhỏ lại */
        border: 2px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        transition: transform 0.3s ease;
        cursor: zoom-in;
        transform-origin: center top;
    }

    .zoom-enabled {
        transform: scale(1.5);
        cursor: zoom-out !important;
        z-index: 10;
        position: relative;
    }

    .hidden { display: none !important; }
    #loadingMsg { color: #007bff; font-weight: bold; margin-top: 20px; font-size: 18px; }
</style>
</head>

<body>

<div class="container">
    <div id="homeView">
        <h1>📚 Chọn đề MAS202 để ôn tập</h1>
        <p><i>(Giao diện dành riêng cho ảnh đề to, nét)</i></p>
        <div id="examList"></div>
    </div>

    <div id="loadingMsg" class="hidden">⏳ Đang tải đề... Vui lòng đợi!</div>

    <div id="quizView" class="hidden">
        <h1 id="examTitle">📚 Ôn Tập MAS202</h1>
        
        <div class="nav-top">
            <button class="btn-home" onclick="goHome()">🏠 Đổi đề khác</button>
            <button onclick="window.location.href='index2.html'">🏠 Về trang chủ chung</button>
            <button onclick="prev()">⬅ Trước</button>
            <button onclick="next()">Tiếp ➡</button>
        </div>

        <div class="header" id="info">Đang tải dữ liệu...</div>

        <div class="img-wrapper">
            <img id="questionImg" src="" class="hidden" onclick="toggleZoom(this)" title="Click để phóng to/thu nhỏ">
            <img id="answerImg" src="" class="hidden" onclick="toggleZoom(this)" title="Click để phóng to/thu nhỏ">
        </div>

        <div>
            <button class="btn-answer" onclick="toggleAnswer()">Hiện/Ẩn đáp án (Space/Enter)</button>
        </div>

        <div class="mode" style="margin-top: 20px;">
            <button onclick="startFull()">Ôn toàn bộ</button>
            <button onclick="startRandom()">Random 50 câu</button>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script>
let currentExam = null;
let questions = [];
let index = 0;
let totalQuestions = 0;

function initHome() {
    const listDiv = document.getElementById("examList");
    listDiv.innerHTML = "";
    
    if (typeof EXAM_LIST === 'undefined' || EXAM_LIST.length === 0) {
        listDiv.innerHTML = "<p style='color:red;'>Chưa tìm thấy đề nào! Bạn đã chạy script quét đề chưa?</p>";
        return;
    }

    // Lọc ra các đề có chữ "mas202"
    const mas202Exams = EXAM_LIST.filter(ex => ex.name.toLowerCase().includes('mas202'));
    
    if (mas202Exams.length === 0) {
        listDiv.innerHTML = "<p style='color:red;'>Không tìm thấy đề MAS202 nào!</p>";
        return;
    }

    mas202Exams.forEach(exam => {
        let btn = document.createElement("button");
        btn.className = "exam-btn";
        btn.innerText = exam.name;
        btn.onclick = () => selectExam(exam);
        listDiv.appendChild(btn);
    });
}

function goHome() {
    document.getElementById("quizView").classList.add("hidden");
    document.getElementById("homeView").classList.remove("hidden");
    currentExam = null;
    questions = [];
}

async function selectExam(exam) {
    currentExam = exam;
    
    document.getElementById("homeView").classList.add("hidden");
    document.getElementById("loadingMsg").classList.remove("hidden");
    
    totalQuestions = await autoDetectQuestionCount(exam.folderDe);
    
    document.getElementById("loadingMsg").classList.add("hidden");
    document.getElementById("quizView").classList.remove("hidden");
    
    document.getElementById("examTitle").innerText = "📚 Ôn Tập " + exam.name;
    
    startFull(); 
}

async function autoDetectQuestionCount(folder) {
    let count = 0;
    let found = true;

    while (found) {
        let nextIndex = count + 1;
        let url = `${folder}/${nextIndex}.jpg`;
        
        let exists = await checkImageExists(url);
        if (exists) {
            count++;
        } else {
            found = false; 
        }
    }
    return count;
}

function checkImageExists(url) {
    return new Promise((resolve) => {
        let img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
    });
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startFull() {
    if (totalQuestions === 0) {
        alert(`Không tìm thấy ảnh nào trong thư mục ${currentExam.folderDe}!`);
        return;
    }
    questions = [];
    for (let i = 1; i <= totalQuestions; i++) {
        questions.push(i);
    }
    index = 0;
    loadQuestion();
}

function startRandom() {
    if (totalQuestions === 0) return;
    questions = [];
    for (let i = 1; i <= totalQuestions; i++) {
        questions.push(i);
    }
    shuffle(questions);
    questions = questions.slice(0, Math.min(50, totalQuestions));
    index = 0;
    loadQuestion();
}

function loadQuestion() {
    if (questions.length === 0 || !currentExam) return;
    
    let q = questions[index];
    let qImg = document.getElementById("questionImg");
    let aImg = document.getElementById("answerImg");

    qImg.classList.remove("zoom-enabled");
    aImg.classList.remove("zoom-enabled");

    qImg.src = `${currentExam.folderDe}/${q}.jpg`;
    aImg.src = `${currentExam.folderDapan}/dapan${q}.jpg`;

    qImg.classList.remove("hidden");
    aImg.classList.add("hidden");

    document.getElementById("info").innerText = 
        `Câu ${index + 1} / ${questions.length}  |  Câu gốc: ${q}`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function next() {
    if (index < questions.length - 1) {
        index++;
        loadQuestion();
    }
}

function prev() {
    if (index > 0) {
        index--;
        loadQuestion();
    }
}

function toggleAnswer() {
    let aImg = document.getElementById("answerImg");
    aImg.classList.toggle("hidden");
}

function toggleZoom(imgEl) {
    imgEl.classList.toggle("zoom-enabled");
}

document.addEventListener("keydown", function(e) {
    if (!document.getElementById("quizView").classList.contains("hidden")) {
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") prev();
        if (e.key === " " || e.key === "Enter") {
            e.preventDefault(); 
            toggleAnswer();
        }
    }
});

// Khởi chạy
window.onload = initHome;
</script>

</body>
</html>
